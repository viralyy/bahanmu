<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream</title>

<style>
:root{
  --bg:#05060f;
  --panel:#0b1020;
  --accent:#3b82f6;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,Segoe UI,Inter,Arial;
}
.wrap{max-width:720px;margin:auto;padding:14px}
.card{
  background:linear-gradient(180deg,#0b1020,#060814);
  border-radius:16px;
  padding:14px;
}
.hidden{display:none}

h1{font-size:18px;margin:6px 0}
.stats{
  display:flex;
  gap:16px;
  font-size:12px;
  color:var(--muted);
}
.online{display:flex;align-items:center;gap:6px}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#22ff00;
  opacity:.25;
  box-shadow:0 0 6px #22ff00;
  transition:.3s;
}
.dot.on{opacity:1}

video{
  width:100%;
  border-radius:14px;
  background:#000;
  margin:12px 0;
  object-fit:contain;
  opacity:0;
  transform:scale(.98);
  transition:.4s ease;
}
video.ready{opacity:1;transform:scale(1)}

/* ===== YT STYLE CONTROLS ===== */
.pro-controls{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  margin-top:14px;
}
.pro-side{
  display:flex;
  gap:10px;
}
.pro-side.left{justify-content:flex-start}
.pro-side.right{justify-content:flex-end}

.small-btn{
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.small-btn select{
  background:transparent;
  border:none;
  color:#fff;
}

.circle-play{
  width:72px;height:72px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,var(--accent),#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(59,130,246,.45);
}
.circle-play:active{transform:scale(.94)}
.circle-play.spin{animation:spin .6s ease}
@keyframes spin{to{transform:rotate(360deg)}}

.play-icon{
  width:0;height:0;
  border-left:22px solid #fff;
  border-top:14px solid transparent;
  border-bottom:14px solid transparent;
  margin-left:4px;
}
.pause-icon{
  display:none;
  width:20px;height:26px;
  position:relative;
}
.pause-icon::before,
.pause-icon::after{
  content:'';
  position:absolute;
  top:0;
  width:6px;height:100%;
  background:#fff;
  border-radius:2px;
}
.pause-icon::after{right:0}
.pause-icon::before{left:0}

/* ===== POPUP ===== */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:flex-end;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.popup.show{opacity:1;pointer-events:auto}
.popup-box{
  width:100%;
  background:#0b1020;
  border-radius:16px 16px 0 0;
  padding:16px;
  transform:translateY(40px);
  transition:.3s;
}
.popup.show .popup-box{transform:translateY(0)}
.popup-box a{
  display:block;
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="wrap">
  <div id="app" class="card hidden">
    <h1 id="title"></h1>

    <div class="stats">
      <div id="views">0 views</div>
      <div class="online">
        <div id="dot" class="dot"></div>
        <span id="onlineText">0 online</span>
      </div>
    </div>

    <video id="player" playsinline></video>

    <div class="pro-controls">
      <div class="pro-side left">
        <button id="rewind5" class="small-btn">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="white" fill="none" stroke-width="2">
            <polygon points="11 19 2 12 11 5 11 19"/>
            <polygon points="22 19 13 12 22 5 22 19"/>
          </svg>
        </button>
        <button id="fs2" class="small-btn">⛶</button>
      </div>

      <div class="pro-center">
        <button id="bigPlay" class="circle-play">
          <div class="play-icon"></div>
          <div class="pause-icon"></div>
        </button>
      </div>

      <div class="pro-side right">
        <button id="forward5" class="small-btn">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="white" fill="none" stroke-width="2">
            <polygon points="2 5 11 12 2 19 2 5"/>
            <polygon points="13 5 22 12 13 19 13 5"/>
          </svg>
        </button>
        <div class="small-btn">
          <select id="speed2">
            <option value="1">1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </div>
      </div>
    </div>

    <button id="openFull" class="small-btn" style="width:100%;margin-top:14px;padding:14px">
      FULL KONTEN
    </button>
  </div>
</div>

<div id="popup" class="popup">
  <div class="popup-box" id="popupBox"></div>
</div>

<script>
const FIREBASE = 'https://views-counter-610fa-default-rtdb.asia-southeast1.firebasedatabase.app';
const id = new URLSearchParams(location.search).get('v');
let allowPlay = false;

fetch('/videos').then(r=>r.json()).then(videos=>{
  if(!id||!videos[id])return;
  const v=videos[id];

  app.classList.remove('hidden');
  title.textContent=v.title;

  player.src=v.src;
  player.onloadeddata=()=>player.classList.add('ready');

  /* iklan logic tetap */
  player.addEventListener('play',e=>{
    if(!allowPlay){
      e.preventDefault();
      player.pause();
      allowPlay=true;
      document.body.click();
      setTimeout(()=>player.play(),300);
    }
  });

  /* yt controls */
  const playIcon=document.querySelector('.play-icon');
  const pauseIcon=document.querySelector('.pause-icon');

  function updateUI(){
    playIcon.style.display=player.paused?'block':'none';
    pauseIcon.style.display=player.paused?'none':'block';
  }

  bigPlay.onclick=()=>{
    bigPlay.classList.add('spin');
    setTimeout(()=>bigPlay.classList.remove('spin'),600);
    player.paused?player.play():player.pause();
  };

  rewind5.onclick=()=>player.currentTime=Math.max(0,player.currentTime-5);
  forward5.onclick=()=>player.currentTime=Math.min(player.duration,player.currentTime+5);
  fs2.onclick=()=>!document.fullscreenElement?player.requestFullscreen():document.exitFullscreen();
  speed2.onchange=e=>player.playbackRate=parseFloat(e.target.value);

  player.onplay=updateUI;
  player.onpause=updateUI;

  /* popup */
  openFull.onclick=()=>{
    popupBox.innerHTML='';
    (v.downloads||[]).forEach(d=>{
      const a=document.createElement('a');
      a.href=d.url;a.target='_blank';a.textContent=d.label;
      popupBox.appendChild(a);
    });
    popup.classList.add('show');
  };
  popup.onclick=e=>e.target===popup&&popup.classList.remove('show');

  /* ===== FIREBASE VIEWS + ONLINE ===== */
  const pageKey=id;
  fetch(`${FIREBASE}/views/${pageKey}.json`)
  .then(r=>r.json()).then(v=>{
    const n=(v||0)+1;
    fetch(`${FIREBASE}/views/${pageKey}.json`,{
      method:'PUT',body:JSON.stringify(n)
    });
    views.textContent=n+' views';
  });

  const uid=Math.random().toString(36).slice(2);
  const myRef=`${FIREBASE}/online/${pageKey}/${uid}.json`;
  fetch(myRef,{method:'PUT',body:'true'});
  window.addEventListener('beforeunload',()=>navigator.sendBeacon(myRef,'null'));

  setInterval(()=>{
    fetch(`${FIREBASE}/online/${pageKey}.json`)
    .then(r=>r.json()).then(d=>{
      const c=d?Object.keys(d).length:0;
      onlineText.textContent=c+' online';
      dot.classList.toggle('on',c>0);
    });
  },3000);
});
</script>

</body>
</html>
