<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream</title>

<style>
:root{
  --bg:#05060f;
  --panel:#0b1020;
  --accent:#3b82f6;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,Segoe UI,Inter,Arial;
}
.wrap{max-width:720px;margin:auto;padding:14px}
.card{
  background:linear-gradient(180deg,#0b1020,#060814);
  border-radius:14px;
  padding:14px;
}
.hidden{display:none}

h1{font-size:18px;margin:6px 0}
.stats{
  display:flex;
  gap:16px;
  font-size:12px;
  color:var(--muted);
}
.online{display:flex;align-items:center;gap:6px}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#22ff00;
  opacity:.25;
  box-shadow:0 0 6px #22ff00;
  transition:.3s;
}
.dot.on{opacity:1}

video{
  width:100%;
  border-radius:14px;
  background:#000;
  margin:12px 0;
  object-fit:contain;
  opacity:0;
  transform:scale(.98);
  transition:.4s ease;
}
video.ready{opacity:1;transform:scale(1)}

.pro-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
}
.pro-side{
  width:90px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.pro-center{
  flex:1;
  display:flex;
  justify-content:center;
}
.circle-play{
  width:70px;
  height:70px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,var(--accent),#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(59,130,246,.45);
}
.circle-play.spin{
  animation:spin .6s ease;
}
@keyframes spin{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}
.play-icon{
  width:0;height:0;
  border-left:20px solid #fff;
  border-top:12px solid transparent;
  border-bottom:12px solid transparent;
  margin-left:4px;
}
.pause-icon{
  display:none;
  width:18px;
  height:24px;
  position:relative;
}
.pause-icon::before,
.pause-icon::after{
  content:'';
  position:absolute;
  width:6px;
  height:100%;
  background:#fff;
  border-radius:2px;
}
.pause-icon::after{right:0}

.small-btn{
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
}
.small-btn svg{display:block;margin:auto}
.small-btn select{
  background:none;border:none;color:#fff;width:100%;
}

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:flex-end;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.popup.show{opacity:1;pointer-events:auto}
.popup-box{
  width:100%;
  background:#0b1020;
  border-radius:16px 16px 0 0;
  padding:16px;
}
.popup-box a{
  display:block;
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:#111827;
  color:#fff;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="wrap">
  <div id="app" class="card hidden">
    <h1 id="title"></h1>

    <div class="stats">
      <div id="views">0 views</div>
      <div class="online">
        <div id="dot" class="dot"></div>
        <span id="onlineText">0 online</span>
      </div>
    </div>

    <video id="player" playsinline></video>

    <div class="pro-controls">
      <div class="pro-side">
        <button id="rewind5" class="small-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="white">
            <polygon points="11,19 2,12 11,5"/>
            <polygon points="22,19 13,12 22,5"/>
          </svg>
        </button>
        <button id="fs2" class="small-btn">⛶</button>
      </div>

      <div class="pro-center">
        <button id="bigPlay" class="circle-play">
          <div class="play-icon"></div>
          <div class="pause-icon"></div>
        </button>
      </div>

      <div class="pro-side">
        <button id="forward5" class="small-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="white">
            <polygon points="2,5 11,12 2,19"/>
            <polygon points="13,5 22,12 13,19"/>
          </svg>
        </button>
        <div class="small-btn">
          <select id="speed2">
            <option value="1">1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </div>
      </div>
    </div>

    <button id="openFull" class="small-btn" style="width:100%;margin-top:14px;padding:14px">
      FULL KONTEN
    </button>
  </div>
</div>

<div id="popup" class="popup">
  <div class="popup-box" id="popupBox"></div>
</div>

<script>
const id = new URLSearchParams(location.search).get('v');
let allowPlay = false;

fetch('/videos')
.then(r=>r.json())
.then(videos=>{
  if(!id || !videos[id]) return;
  const v = videos[id];

  app.classList.remove('hidden');
  title.textContent = v.title;
  player.src = v.src;
  player.onloadeddata=()=>player.classList.add('ready');

  player.addEventListener('play',e=>{
    if(!allowPlay){
      e.preventDefault();
      player.pause();
      allowPlay=true;
      document.body.click();
      setTimeout(()=>player.play(),300);
    }
  });

  const playIcon=document.querySelector('.play-icon');
  const pauseIcon=document.querySelector('.pause-icon');

  function updateUI(){
    playIcon.style.display=player.paused?'block':'none';
    pauseIcon.style.display=player.paused?'none':'block';
  }

  bigPlay.onclick=()=>{
    bigPlay.classList.add('spin');
    setTimeout(()=>bigPlay.classList.remove('spin'),600);
    player.paused?player.play():player.pause();
  };

  player.onplay=updateUI;
  player.onpause=updateUI;

  rewind5.onclick=()=>player.currentTime=Math.max(0,player.currentTime-5);
  forward5.onclick=()=>player.currentTime=Math.min(player.duration,player.currentTime+5);
  fs2.onclick=()=>!document.fullscreenElement?player.requestFullscreen():document.exitFullscreen();
  speed2.onchange=e=>player.playbackRate=parseFloat(e.target.value);

  let lastTap=0;
  player.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-lastTap<300){
      const x=e.changedTouches[0].clientX;
      x<innerWidth/2?rewind5.click():forward5.click();
    }
    lastTap=now;
  });

  openFull.onclick=()=>{
    popupBox.innerHTML='';
    (v.downloads||[]).forEach(d=>{
      const a=document.createElement('a');
      a.href=d.url;a.target='_blank';a.textContent=d.label;
      popupBox.appendChild(a);
    });
    popup.classList.add('show');
  };
  popup.onclick=e=>e.target===popup&&popup.classList.remove('show');
});
</script>

<!-- HISTATS -->
<iframe src="histats.html" style="display:none"></iframe>

<!-- IKLAN -->
<script>
(function(s){
  s.dataset.zone='10109877';
  s.src='https://al5sm.com/tag.min.js';
})([document.documentElement, document.body].filter(Boolean).pop()
.appendChild(document.createElement('script')));
</script>

</body>
</html>
