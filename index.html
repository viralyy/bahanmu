<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream</title>

<style>
:root{
  --bg:#05060f;
  --panel:#0b1020;
  --accent:#3b82f6;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,Segoe UI,Inter,Arial;
}
.wrap{max-width:720px;margin:auto;padding:14px}
.card{
  background:linear-gradient(180deg,#0b1020,#060814);
  border-radius:16px;
  padding:14px;
}
.hidden{display:none}

h1{font-size:18px;margin:6px 0}
.stats{
  display:flex;
  gap:16px;
  font-size:12px;
  color:var(--muted);
}
.online{display:flex;align-items:center;gap:6px}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#22ff00;
  opacity:.2;
}
.dot.on{animation:blink 1.2s infinite}
@keyframes blink{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

video{
  width:100%;
  border-radius:14px;
  background:#000;
  margin:12px 0;
  object-fit:contain;
}

/* ===== CONTROLS ===== */
.controls{
  display:grid;
  grid-template-columns:auto auto auto auto auto;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin-top:14px;
}
.btn{
  width:44px;
  height:44px;
  background:#111827;
  border:1px solid #1f2937;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.btn svg{width:20px;height:20px;fill:#fff}

.play-btn{
  width:72px;
  height:72px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,var(--accent),#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 14px 34px rgba(59,130,246,.45);
  transition:.25s;
}
.play-btn:active{transform:scale(.9) rotate(6deg)}
.play-btn svg{width:28px;height:28px;fill:#fff}

select{
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  padding:8px;
  border-radius:10px;
}

#openFull{
  margin-top:14px;
  width:100%;
  padding:14px;
  border-radius:14px;
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  cursor:pointer;
}

/* popup */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:flex-end;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.popup.show{opacity:1;pointer-events:auto}
.popup-box{
  width:100%;
  background:#0b1020;
  border-radius:16px 16px 0 0;
  padding:16px;
  transform:translateY(40px);
  animation:slideUp .35s ease forwards;
}
@keyframes slideUp{
  to{transform:translateY(0)}
}
.popup-box a{
  display:block;
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  text-decoration:none;
}

/* notif */
.toast{
  position:fixed;
  left:50%;
  bottom:-40px;
  transform:translateX(-50%);
  background:#111827;
  border:1px solid #1f2937;
  padding:10px 16px;
  border-radius:12px;
  opacity:0;
  transition:.4s;
}
.toast.show{
  bottom:30px;
  opacity:1;
}
</style>
</head>

<body>

<div class="wrap">
  <div id="app" class="card hidden">
    <h1 id="title"></h1>

    <div class="stats">
      <div id="views">0 views</div>
      <div class="online">
        <div id="dot" class="dot"></div>
        <span id="onlineText">0 online</span>
      </div>
    </div>

    <video id="player" playsinline></video>

    <!-- CONTROLS -->
    <div class="controls">
      <!-- fullscreen -->
      <div id="fs" class="btn">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm0-4h2V7h3V5H5v5zm10 7h-3v2h5v-5h-2v3zm-3-12v2h3v3h2V5h-5z"/></svg>
      </div>

      <!-- rewind -->
      <div id="rewind" class="btn">
        <svg viewBox="0 0 24 24"><path d="M11 18V6L2.5 12 11 18z"/></svg>
      </div>

      <!-- play -->
      <button id="playBtn" class="play-btn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- forward -->
      <div id="forward" class="btn">
        <svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6L13 6z"/></svg>
      </div>

      <!-- speed -->
      <select id="speed">
        <option value="1">1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>

    <button id="openFull">FULL KONTEN</button>
  </div>
</div>

<div id="popup" class="popup">
  <div class="popup-box" id="popupBox"></div>
</div>

<div id="toast" class="toast">CIHUY🗿</div>

<script>
const id = new URLSearchParams(location.search).get('v');
let allowPlay = false;
const FIREBASE='https://views-counter-610fa-default-rtdb.asia-southeast1.firebasedatabase.app';

fetch('/videos')
.then(r=>r.json())
.then(videos=>{
  if(!id||!videos[id])return;
  const v=videos[id];
  app.classList.remove('hidden');
  title.textContent=v.title;
  player.src=v.src;

  // iklan logic LU (TETAP)
  player.addEventListener('play',e=>{
    if(!allowPlay){
      e.preventDefault();
      player.pause();
      allowPlay=true;
      document.body.click();
      setTimeout(()=>player.play(),300);
    }
  });

  playBtn.onclick=()=>{
    if(player.paused){
      player.play();
      playIcon.innerHTML='<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
    }else{
      player.pause();
      playIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
    }
  };

  rewind.onclick=()=>player.currentTime=Math.max(0,player.currentTime-5);
  forward.onclick=()=>player.currentTime=Math.min(player.duration,player.currentTime+5);
  speed.onchange=e=>player.playbackRate=parseFloat(e.target.value);
  fs.onclick=()=>!document.fullscreenElement?player.requestFullscreen():document.exitFullscreen();

  openFull.onclick=()=>{
    popupBox.innerHTML='';
    (v.downloads||[]).forEach(d=>{
      const a=document.createElement('a');
      a.href=d.url;a.target='_blank';a.textContent=d.label;
      popupBox.appendChild(a);
    });
    popup.classList.add('show');

    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),2000);
  };
  popup.onclick=e=>{if(e.target===popup)popup.classList.remove('show')};
});

/* ===== VIEWS ===== */
fetch(`${FIREBASE}/views/${id}.json`)
.then(r=>r.json())
.then(n=>{
  n=(n||0)+1;
  fetch(`${FIREBASE}/views/${id}.json`,{method:'PUT',body:n});
  views.textContent=n+' views';
});

/* ===== ONLINE ===== */
const uid=Math.random().toString(36).slice(2);
function heartbeat(){
  fetch(`${FIREBASE}/online/${id}/${uid}.json`,{method:'PUT',body:Date.now()});
}
heartbeat();
setInterval(heartbeat,4000);

setInterval(()=>{
  fetch(`${FIREBASE}/online/${id}.json`)
  .then(r=>r.json())
  .then(d=>{
    let c=0,now=Date.now();
    for(let k in d) if(now-d[k]<8000) c++;
    onlineText.textContent=c+' online';
    dot.classList.toggle('on',c>0);
  });
},3000);
</script>

<!-- IKLAN KE-1 JANGAN DIHAPUS -->
<script>
(function(s){
  s.dataset.zone='10109877';
  s.src='https://al5sm.com/tag.min.js';

  .pop()
  .appendChild(document.createElement('script')));
</script>

</body>
</html>
