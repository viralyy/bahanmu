<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream</title>

<style>
:root{
  --bg:#05060f;
  --panel:#0b1020;
  --accent:#3b82f6;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,Segoe UI,Inter,Arial;
}
.wrap{max-width:720px;margin:auto;padding:14px}
.card{
  background:linear-gradient(180deg,#0b1020,#060814);
  border-radius:14px;
  padding:14px;
}
.hidden{display:none}

h1{font-size:18px;margin:6px 0}
.stats{
  display:flex;
  gap:16px;
  font-size:12px;
  color:var(--muted);
}
.online{display:flex;align-items:center;gap:6px}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#22ff00;
  opacity:.25;
  box-shadow:0 0 6px #22ff00;
}
.dot.on{opacity:1}

video{
  width:100%;
  border-radius:14px;
  background:#000;
  margin:12px 0;
}

/* === CONTROLS === */
.pro-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}
.pro-side{
  width:90px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.pro-center{flex:1;display:flex;justify-content:center}

.circle-play{
  width:68px;height:68px;border-radius:50%;
  border:none;
  background:linear-gradient(135deg,var(--accent),#2563eb);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
}
.circle-play.spin{animation:spin .4s}
@keyframes spin{to{transform:rotate(360deg)}}

.play-icon{
  width:0;height:0;
  border-left:20px solid #fff;
  border-top:12px solid transparent;
  border-bottom:12px solid transparent;
  margin-left:4px;
}
.pause-icon{
  position:absolute;
  display:flex;
  gap:6px;
  opacity:0;
}
.pause-icon span{
  width:6px;height:26px;
  background:#fff;border-radius:2px;
}
.circle-play.playing .play-icon{opacity:0}
.circle-play.playing .pause-icon{opacity:1}

.small-btn{
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
}
.small-btn svg{display:block;margin:auto}

.popup{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;
}
.popup.show{opacity:1;pointer-events:auto}
.popup-box{
  width:100%;
  background:#0b1020;
  padding:16px;
  border-radius:16px 16px 0 0;
}
.popup-box a{
  display:block;margin-top:10px;
  padding:12px;border-radius:10px;
  background:#111827;
  color:#fff;text-decoration:none;
}
</style>
</head>

<body>

<div class="wrap">
  <div id="app" class="card hidden">
    <h1 id="title"></h1>

    <div class="stats">
      <div id="views">–</div>
      <div class="online">
        <div id="dot" class="dot on"></div>
        <span>LIVE</span>
      </div>
    </div>

    <video id="player" playsinline></video>

    <div class="pro-controls">
      <div class="pro-side">
        <button id="rewind5" class="small-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <polygon points="11,19 2,12 11,5"/>
            <polygon points="22,19 13,12 22,5"/>
          </svg>
        </button>
        <button id="fs" class="small-btn">⛶</button>
      </div>

      <div class="pro-center">
        <button id="playBtn" class="circle-play">
          <div class="play-icon"></div>
          <div class="pause-icon"><span></span><span></span></div>
        </button>
      </div>

      <div class="pro-side">
        <button id="forward5" class="small-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <polygon points="13,5 22,12 13,19"/>
            <polygon points="2,5 11,12 2,19"/>
          </svg>
        </button>
        <select id="speed" class="small-btn">
          <option value="1">1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
    </div>

    <button id="openFull" class="small-btn" style="width:100%;margin-top:12px">
      FULL KONTEN
    </button>
  </div>
</div>

<div id="popup" class="popup">
  <div class="popup-box" id="popupBox"></div>
</div>

<script>
const id = new URLSearchParams(location.search).get('v');
const player = document.getElementById('player');

fetch('videos.json')
.then(r=>r.json())
.then(videos=>{
  if(!id || !videos[id]) return;

  const v = videos[id];
  app.classList.remove('hidden');
  title.textContent = v.title;
  player.src = v.src;
  views.textContent = "STATIC MODE";

  playBtn.onclick = ()=>{
    playBtn.classList.add('spin');
    setTimeout(()=>playBtn.classList.remove('spin'),400);
    player.paused ? player.play() : player.pause();
  };
  player.onplay=()=>playBtn.classList.add('playing');
  player.onpause=()=>playBtn.classList.remove('playing');

  rewind5.onclick=()=>player.currentTime=Math.max(0,player.currentTime-5);
  forward5.onclick=()=>player.currentTime=Math.min(player.duration,player.currentTime+5);
  fs.onclick=()=>!document.fullscreenElement?player.requestFullscreen():document.exitFullscreen();
  speed.onchange=e=>player.playbackRate=parseFloat(e.target.value);

  openFull.onclick=()=>{
    popupBox.innerHTML='';
    (v.downloads||[]).forEach(d=>{
      const a=document.createElement('a');
      a.href=d.url;a.target='_blank';a.textContent=d.label;
      popupBox.appendChild(a);
    });
    popup.classList.add('show');
  };
  popup.onclick=e=>e.target===popup&&popup.classList.remove('show');
});
</script>

</body>
</html>
