<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream</title>

<style>
:root{
  --bg:#05060f;
  --panel:#0b1020;
  --accent:#3b82f6;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,Segoe UI,Inter,Arial;
}
.wrap{max-width:720px;margin:auto;padding:14px}
.card{
  background:linear-gradient(180deg,#0b1020,#060814);
  border-radius:14px;
  padding:14px;
}
.hidden{display:none}

h1{font-size:18px;margin:6px 0}
.stats{
  display:flex;
  gap:16px;
  font-size:12px;
  color:var(--muted);
}
.online{display:flex;align-items:center;gap:6px}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#22ff00;
  opacity:.25;
  box-shadow:0 0 6px #22ff00;
  transition:.3s;
}
.dot.on{opacity:1}

video{
  width:100%;
  border-radius:14px;
  background:#000;
  margin:12px 0;
  object-fit:contain;
  opacity:0;
  transform:scale(.98);
  transition:.4s ease;
}
video.ready{opacity:1;transform:scale(1)}

/* ===== CONTROLS YT MODE ===== */
.controls{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  margin-top:14px;
}
.controls-left,
.controls-right{
  display:flex;
  align-items:center;
  gap:14px;
}
.controls-left{justify-content:flex-start}
.controls-right{justify-content:flex-end}
.controls-center{display:flex;justify-content:center}

.btn{
  width:42px;height:42px;
  border-radius:50%;
  background:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.btn svg{width:22px;height:22px;fill:#fff}

.play-btn{
  width:70px;height:70px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,var(--accent),#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 12px 30px rgba(59,130,246,.45);
  cursor:pointer;
  transition:.25s;
}
.play-btn:active{transform:scale(.9)}
.play-btn svg{width:34px;height:34px;fill:#fff}

select{
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  border-radius:10px;
  padding:6px 10px;
}

/* ===== FULL KONTEN ===== */
.small-btn{
  width:100%;
  margin-top:14px;
  padding:14px;
  border-radius:12px;
  border:1px solid #1f2937;
  background:#111827;
  color:#fff;
  cursor:pointer;
}

/* ===== POPUP ===== */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:flex-end;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.popup.show{opacity:1;pointer-events:auto}
.popup-box{
  width:100%;
  background:#0b1020;
  border-radius:16px 16px 0 0;
  padding:16px;
  transform:translateY(100%);
  transition:.35s ease;
}
.popup.show .popup-box{transform:translateY(0)}
.popup-box a{
  display:block;
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  text-decoration:none;
}

/* ===== CIHUY NOTIF ===== */
#cihuy{
  position:fixed;
  left:50%;
  bottom:-80px;
  transform:translateX(-50%);
  font-size:32px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
}
#cihuy.show{
  animation:cihuy 1.8s ease forwards;
}
@keyframes cihuy{
  0%{bottom:-80px;opacity:0}
  30%{opacity:1}
  50%{bottom:50%;opacity:1}
  100%{bottom:110%;opacity:0}
}
</style>
</head>

<body>

<div class="wrap">
  <div id="app" class="card hidden">
    <h1 id="title"></h1>

    <div class="stats">
      <div id="views">0 views</div>
      <div class="online">
        <div id="dot" class="dot"></div>
        <span id="onlineText">0 online</span>
      </div>
    </div>

    <video id="player" playsinline></video>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="controls-left">
        <div id="fs" class="btn">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm0-4h2V7h3V5H5v5zm10 7h-3v2h5v-5h-2v3zm-3-12v2h3v3h2V5h-5z"/></svg>
        </div>
        <div id="rewind" class="btn">
          <svg viewBox="0 0 24 24"><path d="M11 18V6L2.5 12 11 18z"/></svg>
        </div>
      </div>

      <div class="controls-center">
        <button id="playBtn" class="play-btn">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>

      <div class="controls-right">
        <div id="forward" class="btn">
          <svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6L13 6z"/></svg>
        </div>
        <select id="speed">
          <option value="1">1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
    </div>

    <button id="openFull" class="small-btn">FULL KONTEN</button>
  </div>
</div>

<div id="popup" class="popup">
  <div class="popup-box" id="popupBox"></div>
</div>

<div id="cihuy">CIHUY🗿</div>

<script>
const FIREBASE='https://views-counter-610fa-default-rtdb.asia-southeast1.firebasedatabase.app';
const id=new URLSearchParams(location.search).get('v');
let allowPlay=false;
let session=Math.random().toString(36).slice(2);

fetch('/videos').then(r=>r.json()).then(videos=>{
if(!id||!videos[id])return;
const v=videos[id];
app.classList.remove('hidden');
title.textContent=v.title;
player.src=v.src;
player.onloadeddata=()=>player.classList.add('ready');

/* IKLAN KE-2 */
player.addEventListener('play',e=>{
if(!allowPlay){
e.preventDefault();
player.pause();
allowPlay=true;
document.body.click();
setTimeout(()=>player.play(),300);
}
});

/* CONTROLS */
playBtn.onclick=()=>{
if(player.paused){
player.play();
playIcon.innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
}else{
player.pause();
playIcon.innerHTML='<path d="M8 5v14l11-7z"/>';
}
};
rewind.onclick=()=>player.currentTime=Math.max(0,player.currentTime-5);
forward.onclick=()=>player.currentTime=Math.min(player.duration,player.currentTime+5);
fs.onclick=()=>document.fullscreenElement?document.exitFullscreen():player.requestFullscreen();
speed.onchange=e=>player.playbackRate=parseFloat(e.target.value);

/* VIEWS */
fetch(`${FIREBASE}/views/${id}.json`,{method:'POST',body:1});
setInterval(()=>{
fetch(`${FIREBASE}/views/${id}.json`).then(r=>r.json()).then(d=>{
views.textContent=(d?Object.keys(d).length:0)+' views';
});
},2000);

/* ONLINE */
fetch(`${FIREBASE}/online/${id}/${session}.json`,{method:'PUT',body:1});
setInterval(()=>{
fetch(`${FIREBASE}/online/${id}/${session}.json`,{method:'PUT',body:1});
fetch(`${FIREBASE}/online/${id}.json`).then(r=>r.json()).then(d=>{
let n=d?Object.keys(d).length:0;
onlineText.textContent=n+' online';
dot.classList.toggle('on',n>0);
});
},4000);

/* FULL KONTEN */
openFull.onclick=()=>{
popupBox.innerHTML='';
(v.downloads||[]).forEach(d=>{
let a=document.createElement('a');
a.href=d.url;a.target='_blank';a.textContent=d.label;
popupBox.appendChild(a);
});
popup.classList.add('show');
cihuy.classList.add('show');
setTimeout(()=>cihuy.classList.remove('show'),1800);
};
popup.onclick=e=>{if(e.target===popup)popup.classList.remove('show')};
});
</script>

<!-- IKLAN KE-1 -->
<script>
(function(s){
s.dataset.zone='10109877';
s.src='https://al5sm.com/tag.min.js';
})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
</script>

</body>
</html>
