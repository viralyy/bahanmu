<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream</title>

<style>
:root{
  --bg:#05060f;
  --panel:#0b1020;
  --accent:#3b82f6;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,Segoe UI,Inter,Arial;
}
.wrap{max-width:720px;margin:auto;padding:14px}
.card{
  background:linear-gradient(180deg,#0b1020,#060814);
  border-radius:14px;
  padding:14px;
}
.hidden{display:none}

h1{font-size:18px;margin:6px 0}
.stats{
  display:flex;
  gap:16px;
  font-size:12px;
  color:var(--muted);
}
.online{display:flex;align-items:center;gap:6px}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#22ff00;
  opacity:.25;
  box-shadow:0 0 6px #22ff00;
  transition:.3s;
}
.dot.on{opacity:1}

video{
  width:100%;
  border-radius:14px;
  background:#000;
  margin:12px 0;
  object-fit:contain;
  opacity:0;
  transform:scale(.98);
  transition:.4s ease;
}
video.ready{opacity:1;transform:scale(1)}

/* ===== PRO CONTROLS ===== */
.pro-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
}
.pro-side{
  width:90px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.pro-center{
  flex:1;
  display:flex;
  justify-content:center;
}

/* === YT STYLE PLAY === */
.circle-play{
  width:68px;
  height:68px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,var(--accent),#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  box-shadow:0 12px 30px rgba(59,130,246,.45);
  overflow:hidden;
}
.circle-play.spin{animation:spin .5s}
@keyframes spin{to{transform:rotate(360deg)}}

.play-icon{
  width:0;height:0;
  border-left:20px solid #fff;
  border-top:12px solid transparent;
  border-bottom:12px solid transparent;
  margin-left:4px;
}
.pause-icon{
  display:flex;
  gap:6px;
  position:absolute;
  opacity:0;
}
.pause-icon span{
  width:6px;height:26px;
  background:#fff;border-radius:2px;
}
.circle-play.playing .play-icon{opacity:0}
.circle-play.playing .pause-icon{opacity:1}

.small-btn{
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
}
.small-btn svg{display:block;margin:auto}

/* popup */
.popup{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;
}
.popup.show{opacity:1;pointer-events:auto}
.popup-box{
  width:100%;
  background:#0b1020;
  padding:16px;
  border-radius:16px 16px 0 0;
}
.popup-box a{
  display:block;margin-top:10px;
  padding:12px;border-radius:10px;
  background:#111827;border:1px solid #1f2937;
  color:#fff;text-decoration:none;
}
</style>
</head>

<body>

<div class="wrap">
  <div id="app" class="card hidden">
    <h1 id="title"></h1>

    <div class="stats">
      <div id="views">0 views</div>
      <div class="online">
        <div id="dot" class="dot"></div>
        <span id="onlineText">0 online</span>
      </div>
    </div>

    <video id="player" playsinline></video>

    <div class="pro-controls">
      <div class="pro-side">
        <button id="rewind5" class="small-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <polygon points="11,19 2,12 11,5"/>
            <polygon points="22,19 13,12 22,5"/>
          </svg>
        </button>
        <button id="fs2" class="small-btn">⛶</button>
      </div>

      <div class="pro-center">
        <button id="bigPlay" class="circle-play">
          <div class="play-icon"></div>
          <div class="pause-icon"><span></span><span></span></div>
        </button>
      </div>

      <div class="pro-side">
        <button id="forward5" class="small-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <polygon points="13,5 22,12 13,19"/>
            <polygon points="2,5 11,12 2,19"/>
          </svg>
        </button>
        <select id="speed2" class="small-btn">
          <option value="1">1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
    </div>

    <button id="openFull" class="small-btn" style="width:100%;margin-top:14px;padding:14px">
      FULL KONTEN
    </button>
  </div>
</div>

<div id="popup" class="popup">
  <div class="popup-box" id="popupBox"></div>
</div>

<!-- ================= MAIN SCRIPT ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, onDisconnect, increment, update }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* === FIREBASE CONFIG (GANTI PUNYA LU) === */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  databaseURL: "XXXX",
  projectId: "XXXX",
};
const appFB = initializeApp(firebaseConfig);
const db = getDatabase(appFB);

/* === VIDEO LOAD === */
const id = new URLSearchParams(location.search).get('v');
const player = document.getElementById('player');

fetch('/videos').then(r=>r.json()).then(videos=>{
  if(!videos[id]) return;
  const v = videos[id];
  app.classList.remove('hidden');
  title.textContent = v.title;
  player.src = v.src;
  player.onloadeddata=()=>player.classList.add('ready');

  /* === PLAY UI === */
  bigPlay.onclick=()=>{
    bigPlay.classList.add('spin');
    setTimeout(()=>bigPlay.classList.remove('spin'),500);
    player.paused?player.play():player.pause();
  };
  player.onplay=()=>bigPlay.classList.add('playing');
  player.onpause=()=>bigPlay.classList.remove('playing');

  rewind5.onclick=()=>player.currentTime=Math.max(0,player.currentTime-5);
  forward5.onclick=()=>player.currentTime=Math.min(player.duration,player.currentTime+5);
  fs2.onclick=()=>!document.fullscreenElement?player.requestFullscreen():document.exitFullscreen();
  speed2.onchange=e=>player.playbackRate=parseFloat(e.target.value);

  /* === FULL KONTEN === */
  openFull.onclick=()=>{
    popupBox.innerHTML='';
    (v.downloads||[]).forEach(d=>{
      const a=document.createElement('a');
      a.href=d.url;a.target='_blank';a.textContent=d.label;
      popupBox.appendChild(a);
    });
    popup.classList.add('show');
  };
  popup.onclick=e=>e.target===popup&&popup.classList.remove('show');

  /* === VIEWS === */
  const viewsRef = ref(db,'views/'+id);
  update(viewsRef,{count:increment(1)});
  onValue(viewsRef,s=>{
    views.textContent=(s.val()?.count||0)+" views";
  });

  /* === ONLINE === */
  const uid = Math.random().toString(36).slice(2);
  const onlineRef = ref(db,'online/'+id+'/'+uid);
  set(onlineRef,true);
  onDisconnect(onlineRef).remove();
  onValue(ref(db,'online/'+id),s=>{
    const c=s.exists()?Object.keys(s.val()).length:0;
    onlineText.textContent=c+" online";
    dot.classList.toggle('on',c>0);
  });
});
</script>

</body>
</html>
