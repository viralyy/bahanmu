<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream</title>

<style>
:root{
  --bg:#05060f;
  --panel:#0b1020;
  --accent:#3b82f6;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,Segoe UI,Inter,Arial;
}
.wrap{max-width:720px;margin:auto;padding:14px}
.card{
  background:linear-gradient(180deg,#0b1020,#060814);
  border-radius:16px;
  padding:16px;
}
.hidden{display:none}

h1{font-size:18px;margin:6px 0}
.stats{
  display:flex;
  gap:16px;
  font-size:12px;
  color:var(--muted);
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#22ff00;
  opacity:.25;
  box-shadow:0 0 6px #22ff00;
}
.dot.on{opacity:1}

video{
  width:100%;
  aspect-ratio:16/9;
  border-radius:14px;
  background:#000;
  margin:12px 0;
  object-fit:contain;
}

/* ===== CONTROLS ===== */
.controls{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  margin-top:14px;
}
.left,.right{
  display:flex;
  gap:10px;
}
.center{display:flex;justify-content:center}

.icon-btn{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:12px;
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.icon-btn svg{width:22px;height:22px;fill:#fff}

.play-btn{
  width:64px;height:64px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,var(--accent),#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 10px 28px rgba(59,130,246,.45);
}
.play-btn svg{width:28px;height:28px;fill:#fff}
.play-btn .pause{display:none}
.play-btn.playing .play{display:none}
.play-btn.playing .pause{display:block}

select{
  background:#111827;
  color:#fff;
  border:1px solid #1f2937;
  border-radius:10px;
  padding:8px;
}

.full-btn{
  width:100%;
  margin-top:14px;
  padding:12px;
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  border-radius:12px;
}

/* popup */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:flex-end;
  opacity:0;
  pointer-events:none;
}
.popup.show{opacity:1;pointer-events:auto}
.popup-box{
  width:100%;
  background:#0b1020;
  border-radius:16px 16px 0 0;
  padding:16px;
}
.popup-box a{
  display:block;
  padding:12px;
  margin-top:8px;
  background:#111827;
  border:1px solid #1f2937;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
}
</style>
</head>

<body>
<div class="wrap">
  <div id="app" class="card hidden">
    <h1 id="title"></h1>
    <div class="stats">
      <span id="views">0 views</span>
      <span><span id="dot" class="dot"></span> <span id="online">0 online</span></span>
    </div>

    <video id="player" playsinline></video>

    <div class="controls">
      <div class="left">
        <button id="rew" class="icon-btn">
          <svg viewBox="0 0 24 24"><path d="M11 18V6L2.5 12 11 18zm1-6 8.5 6V6L12 12z"/></svg>
        </button>
        <button id="fs" class="icon-btn">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm0-4h2V7h3V5H5v5zm10 9h-3v2h5v-5h-2v3zm0-14V7h-3v2h5V5h-2z"/></svg>
        </button>
      </div>

      <div class="center">
        <button id="playBtn" class="play-btn">
          <svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
      </div>

      <div class="right">
        <button id="fwd" class="icon-btn">
          <svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6L13 6zM11 12 2.5 6v12L11 12z"/></svg>
        </button>
        <select id="speed">
          <option value="1">1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
    </div>

    <button id="fullBtn" class="full-btn">FULL KONTEN</button>
  </div>
</div>

<div id="popup" class="popup"><div id="popupBox" class="popup-box"></div></div>

<script>
const FIREBASE='https://views-counter-610fa-default-rtdb.asia-southeast1.firebasedatabase.app';
const id=new URLSearchParams(location.search).get('v');

fetch('/videos').then(r=>r.json()).then(v=>{
  if(!v[id])return;
  const d=v[id];
  app.classList.remove('hidden');
  title.textContent=d.title;
  player.src=d.src;

  playBtn.onclick=()=>player.paused?player.play():player.pause();
  player.onplay=()=>playBtn.classList.add('playing');
  player.onpause=()=>playBtn.classList.remove('playing');

  rew.onclick=()=>player.currentTime=Math.max(0,player.currentTime-5);
  fwd.onclick=()=>player.currentTime=Math.min(player.duration,player.currentTime+5);
  fs.onclick=()=>player.requestFullscreen();
  speed.onchange=e=>player.playbackRate=parseFloat(e.target.value);

  fullBtn.onclick=()=>{
    popupBox.innerHTML='';
    d.downloads.forEach(x=>{
      let a=document.createElement('a');
      a.href=x.url;a.target='_blank';a.textContent=x.label;
      popupBox.appendChild(a);
    });
    popup.classList.add('show');
  };
  popup.onclick=e=>e.target===popup&&popup.classList.remove('show');

  fetch(`${FIREBASE}/views/${id}.json`).then(r=>r.json()).then(n=>{
    n=(n||0)+1;
    fetch(`${FIREBASE}/views/${id}.json`,{method:'PUT',body:n});
    views.textContent=n+' views';
  });

  const uid=Math.random().toString(36).slice(2);
  fetch(`${FIREBASE}/online/${id}/${uid}.json`,{method:'PUT',body:1});
  setInterval(()=>{
    fetch(`${FIREBASE}/online/${id}.json`).then(r=>r.json()).then(o=>{
      const c=o?Object.keys(o).length:0;
      online.textContent=c+' online';
      dot.classList.toggle('on',c>0);
    });
  },3000);
});
</script>
</body>
</html>
