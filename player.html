<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream</title>

<style>
:root{
  --bg:#000;
  --panel:#0b1020;
  --accent:#3b82f6;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:var(--text);
  font-family:system-ui,Segoe UI,Inter,Arial;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
}
.header h1{
  font-size:18px;
  margin:0;
  font-weight:700;
}
.header a{
  padding:7px 14px;
  background:#111827;
  border-radius:10px;
  font-size:13px;
  color:#fff;
  text-decoration:none;
}

/* ===== WRAP ===== */
.wrap{max-width:720px;margin:auto}
.card{padding:12px}

/* ===== STATS ===== */
.stats{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
}
.online{display:flex;align-items:center;gap:6px}
.dot{
  width:8px;height:8px;
  border-radius:50%;
  background:#22ff00;
  opacity:.3;
}
.dot.on{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:1}}

/* ===== PLAYER 16:9 ===== */
.player-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  margin:14px 0;
  border-radius:14px;
  overflow:hidden;
}
.player-wrap video{
  width:100%;
  height:100%;
  background:#000;
}

/* ===== ACTION BUTTONS ===== */
.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.action{
  flex:1;
  padding:12px;
  background:#111827;
  border-radius:12px;
  border:none;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}

/* ===== FULL KONTEN ===== */
.full-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:700;
  color:#fff;
  cursor:pointer;
}

/* ===== EXTRA BUTTON ===== */
.bottom-actions{
  margin-top:10px;
}
.bottom-actions .action{
  width:100%;
}

/* ===== POPUP ===== */
.popup{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:999;
}
.popup.show{display:flex}
.popup-bg{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.65);
}
.popup-box{
  position:relative;
  width:95%;
  max-width:500px;
  max-height:70vh;
  background:#0b1020;
  border-radius:18px 18px 0 0;
  padding:16px;
  transform:translateY(100%);
  animation:slideUp .4s forwards;
  overflow-y:auto;
}
@keyframes slideUp{to{transform:translateY(0)}}
.popup-box a{
  display:block;
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  background:#111827;
  color:#fff;
  text-decoration:none;
  font-weight:600;
}

/* ===== FOOTER ===== */
footer{
  margin-top:28px;
  padding:16px;
  text-align:center;
  font-size:12px;
  color:#6b7280;
  border-top:1px solid #111827;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1 id="title">Judul Video</h1>
  <a href="https://wa.me/628xxxxxxxxx" target="_blank">Saluran WA</a>
</div>

<div class="wrap">
<div id="app" class="card">

<!-- STATS -->
<div class="stats">
  <div id="views">0 views</div>
  <div class="online">
    <div id="dot" class="dot"></div>
    <span id="onlineText">0 online</span>
  </div>
</div>

<!-- PLAYER -->
<div class="player-wrap">
  <video id="player" playsinline></video>
</div>

<!-- SHARE / COPY / DOWNLOAD (ID AMAN) -->
<div class="actions">
  <button id="shareBtn" class="action">Share</button>
  <button id="copyBtn" class="action">Copy</button>
  <button id="downloadBtn" class="action">Download</button>
</div>

<!-- FULL KONTEN -->
<button id="openFull" class="full-btn">FULL KONTEN</button>

<!-- TOMBOL BAWAH (MASIH ADA) -->
<div class="actions bottom-actions">
  <button id="extraBtn" class="action">Lanjut</button>
</div>

</div>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-bg"></div>
  <div class="popup-box" id="popupBox"></div>
</div>

<footer>
  © 2026 Videy • All Rights Reserved
</footer>
