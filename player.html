<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream</title>

<style>
:root{
  --bg:#020617;
  --panel:#0b1020;
  --accent:#3b82f6;
  --text:#e5e7eb;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:var(--text);
  font-family:system-ui,Segoe UI,Inter,Arial;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  background:#000;
}
.header h1{
  font-size:18px;
  margin:0;
  font-weight:700;
}
.header a{
  padding:7px 14px;
  background:#111827;
  border-radius:10px;
  font-size:13px;
  color:#fff;
  text-decoration:none;
}

/* ===== CONTENT ===== */
.wrap{max-width:720px;margin:auto}
.card{padding:12px}

.stats{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:12px;
  color:var(--muted);
}
.online{display:flex;align-items:center;gap:6px}
.dot{
  width:8px;height:8px;
  border-radius:50%;
  background:#22ff00;
  opacity:.3;
}
.dot.on{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:1}}

/* ===== PLAYER 16:9 ===== */
.player-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  margin:14px 0;
}
.player-wrap video{
  width:100%;
  height:100%;
}

/* ===== SHARE BUTTONS ===== */
.actions{
  display:flex;
  gap:10px;
}
.action{
  flex:1;
  padding:12px;
  text-align:center;
  background:#111827;
  border-radius:12px;
  font-size:14px;
}

/* ===== FULL KONTEN ===== */
.full-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:700;
  color:#fff;
}

/* ===== FOOTER ===== */
footer{
  margin-top:30px;
  padding:16px;
  text-align:center;
  font-size:12px;
  color:#6b7280;
  border-top:1px solid #111827;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1 id="title">Judul Video</h1>
  <a href="https://wa.me/628xxxxxxxxx" target="_blank">Saluran WA</a>
</div>

<div class="wrap">
<div id="app" class="card">

<!-- STATS -->
<div class="stats">
  <div id="views">0 views</div>
  <div class="online">
    <div id="dot" class="dot"></div>
    <span id="onlineText">0 online</span>
  </div>
</div>

<!-- PLAYER -->
<div class="player-wrap">
  <video id="player" playsinline></video>
</div>

<!-- SHARE -->
<div class="actions">
  <div class="action">Share</div>
  <div class="action">Copy</div>
  <div class="action">Download</div>
</div>

<!-- FULL KONTEN -->
<button id="openFull" class="full-btn">FULL KONTEN</button>

</div>
</div>

<footer>
  © 2026 Videy • All Rights Reserved
</footer>
