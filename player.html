<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>videy</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui,Segoe UI,Inter,Arial;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
}
.header h1{
  font-size:17px;
  font-weight:600;
  margin:0;
}
.header a{
  padding:6px 14px;
  background:#111;
  border-radius:20px;
  font-size:13px;
  color:#fff;
  text-decoration:none;
}

/* ===== CONTAINER ===== */
.wrap{max-width:720px;margin:auto}
.card{padding:12px}

/* ===== STATS (ASLI) ===== */
.stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:#aaa;
  margin:6px 0 10px;
}
.online{
  display:flex;
  align-items:center;
  gap:6px;
}
.dot{
  width:7px;height:7px;
  border-radius:50%;
  background:#22ff00;
  opacity:.3;
}
.dot.on{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:1}}

/* ===== PLAYER 16:9 ===== */
.player-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}
.player-wrap video{
  width:100%;
  height:100%;
  background:#000;
}

/* ===== PROGRESS (ASLI) ===== */
.progress-container{
  width:100%;
  height:6px;
  background:#111;
  border-radius:6px;
  margin:10px 0;
  position:relative;
}
.progress-bar{
  height:100%;
  width:0%;
  background:#555;
}
.progress-handle{
  position:absolute;
  top:50%;
  width:12px;
  height:12px;
  background:#fff;
  border-radius:50%;
  transform:translate(-50%,-50%);
}
.progress-tooltip{display:none}

/* ===== CONTROLS (ASLI) ===== */
.controls{
  display:flex;
  justify-content:center;
  gap:14px;
  margin:10px 0;
}
.ctrl,
.play-btn,
select{
  background:#111;
  border:none;
  color:#fff;
}
.ctrl{
  width:38px;height:38px;
  border-radius:10px;
}
.play-btn{
  width:60px;height:60px;
  border-radius:50%;
}
select{
  width:44px;
  height:38px;
  border-radius:10px;
}

/* ===== SHARE / COPY / DOWNLOAD (ASLI, CUMA POSISI) ===== */
.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}
.actions > *{
  flex:1;
  padding:12px 0;
  background:#111;
  border-radius:14px;
  text-align:center;
  font-size:14px;
}

/* ===== FULL KONTEN ===== */
.full-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  background:#111;
  border:none;
  border-radius:16px;
  font-size:15px;
  font-weight:600;
  color:#fff;
}

/* ===== POPUP (ASLI) ===== */
.popup{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:999;
}
.popup.show{display:flex}
.popup-bg{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.7);
}
.popup-box{
  position:relative;
  width:100%;
  max-width:500px;
  background:#000;
  border-radius:18px 18px 0 0;
  padding:14px;
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  font-size:12px;
  color:#666;
  padding:18px 0;
  border-top:1px solid #111;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="header">
  <h1 id="title"></h1>
  <a href="https://wa.me/628xxxxxxxxx" target="_blank">Saluran WA</a>
</div>

<div class="wrap">
<div id="app" class="card">

<div class="stats">
  <div id="views">0 views</div>
  <div class="online">
    <div id="dot" class="dot"></div>
    <span id="onlineText">0 online</span>
  </div>
</div>

<div class="player-wrap">
  <video id="player" playsinline></video>
</div>

<div class="progress-container" id="progressContainer">
  <div id="progress" class="progress-bar"></div>
  <div id="handle" class="progress-handle"></div>
  <div id="tooltip" class="progress-tooltip">0:00</div>
</div>

<div class="controls">
  <div id="fs" class="ctrl"></div>
  <div id="rewind" class="ctrl"></div>
  <button id="playBtn" class="play-btn"></button>
  <div id="forward" class="ctrl"></div>
  <select id="speed">
    <option value="1">1x</option>
    <option value="1.25">1.25x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2x</option>
  </select>
</div>

<div class="actions">
  <div>Share</div>
  <div>Copy</div>
  <div>Download</div>
</div>

<button id="openFull" class="full-btn">FULL KONTEN</button>

</div>
</div>

<div id="popup" class="popup">
  <div class="popup-bg"></div>
  <div class="popup-box" id="popupBox"></div>
</div>

<footer>Bahanmu</footer>

</html>
