<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Videy</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui,Segoe UI,Inter,Arial;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
}
.header h1{
  font-size:17px;
  font-weight:600;
  margin:0;
}
.header a{
  padding:6px 14px;
  border-radius:20px;
  background:#111;
  font-size:13px;
  color:#fff;
  text-decoration:none;
}

/* ===== CONTENT ===== */
.wrap{
  max-width:720px;
  margin:auto;
}
.card{
  padding:12px;
}

/* ===== STATS ===== */
.stats{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#aaa;
  margin:6px 0 10px;
}
.online{
  display:flex;
  align-items:center;
  gap:6px;
}
.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#0f0;
  opacity:.3;
}
.dot.on{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:1}}

/* ===== PLAYER ===== */
.player-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}
.player-wrap video{
  width:100%;
  height:100%;
  background:#000;
}

/* ===== ACTION BUTTONS ===== */
.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}
.action{
  flex:1;
  padding:12px 0;
  border-radius:14px;
  background:#111;
  border:none;
  color:#fff;
  font-size:14px;
}

/* ===== FULL KONTEN ===== */
.full-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border-radius:16px;
  background:#1a1a1a;
  border:none;
  font-size:15px;
  font-weight:600;
  color:#fff;
}

/* ===== EXTRA ===== */
.bottom-actions{
  margin-top:10px;
}
.bottom-actions .action{
  width:100%;
}

/* ===== POPUP ===== */
.popup{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:999;
}
.popup.show{display:flex}
.popup-bg{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.7);
}
.popup-box{
  position:relative;
  width:100%;
  max-width:500px;
  background:#000;
  border-radius:18px 18px 0 0;
  padding:14px;
  max-height:70vh;
  overflow:auto;
}
.popup-box a{
  display:block;
  padding:14px;
  border-radius:14px;
  background:#111;
  margin-bottom:10px;
  color:#fff;
  text-decoration:none;
  font-size:15px;
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  font-size:12px;
  color:#666;
  padding:18px 10px;
  border-top:1px solid #111;
  margin-top:20px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1 id="title">Judul Video</h1>
  <a href="https://wa.me/628xxxxxxxxx" target="_blank">Saluran WA</a>
</div>

<div class="wrap">
<div id="app" class="card">

<!-- STATS -->
<div class="stats">
  <div id="views">0 views</div>
  <div class="online">
    <div id="dot" class="dot"></div>
    <span id="onlineText">0 online</span>
  </div>
</div>

<!-- PLAYER -->
<div class="player-wrap">
  <video id="player" playsinline></video>
</div>

<!-- SHARE / COPY / DOWNLOAD -->
<div class="actions">
  <button id="shareBtn" class="action">Share</button>
  <button id="copyBtn" class="action">Copy</button>
  <button id="downloadBtn" class="action">Download</button>
</div>

<!-- FULL KONTEN -->
<button id="openFull" class="full-btn">FULL KONTEN</button>

<!-- TOMBOL BAWAH -->
<div class="actions bottom-actions">
  <button id="extraBtn" class="action">Lanjut</button>
</div>

</div>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-bg"></div>
  <div class="popup-box" id="popupBox"></div>
</div>

<footer>
  © 2026 Videy
</footer>
